name: One-Time Original Audio Migration

on:
  push:
    branches: ['infra/audio-worker-reliability-issue-12']
    paths:
      - '.github/workflows/migrate-original-audio.yml'
      - 'scripts/fetch_original_audio.mjs'

permissions:
  contents: write

concurrency:
  group: original-audio-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Capture hash-verified original WAVs as static site assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and SHA-256-verify both source recordings
        run: node scripts/fetch_original_audio.mjs
      - name: Commit original binary WAVs to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/fja-lesson-audio-l06-a.wav public/audio/fja-lesson-audio-l06-b.wav
          if git diff --cached --quiet; then
            echo "Audio already present and identical"
            exit 0
          fi
          git commit -m "fix(audio): preserve original WAVs as static Cloudflare Pages assets (#12)"
          git push origin HEAD:infra/audio-worker-reliability-issue-12
