name: Audio Delivery Monitor

on:
  schedule:
    - cron: '27 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/audio/**'
      - 'src/content/audio/**'
      - 'scripts/check_audio_delivery.mjs'
      - 'functions/audio/**'
  pull_request:
    branches: [main]
    paths:
      - 'public/audio/**'
      - 'src/content/audio/**'
      - 'scripts/check_audio_delivery.mjs'
      - 'scripts/verify_static_audio.mjs'
      - 'functions/audio/**'

permissions:
  contents: read

concurrency:
  group: audio-delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audio-integrity:
    name: Verify all checked-in SHA-256 WAVs (speaking + dialogue)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify_static_audio.mjs

  audio-integration:
    name: Live Cloudflare Pages WAV availability and ranges (all tracks)
    if: github.event_name != 'pull_request'
    needs: [audio-integrity]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for production Pages upload on first merge
        if: github.event_name == 'push'
        shell: bash
        run: |
          for attempt in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' 'https://free-japanese-academy.pages.dev/audio/fja-lesson-audio-l06-a.wav' || true)
            if [ "$code" = "200" ]; then break; fi
            echo "Cloudflare Pages static asset not ready: HTTP $code"
            sleep 10
          done
      - name: Perform 72 strict full/range/HEAD WAV requests (no hidden retries)
        run: node scripts/check_audio_delivery.mjs

  audio-preview:
    name: Live byte-range and integrity checks on Cloudflare Pages preview
    if: github.event_name == 'pull_request'
    needs: [audio-integrity]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staged WAVs locally before preview promotion
        run: node scripts/verify_static_audio.mjs
      # Production live network checks run after the merged Pages deployment.
      # Never probe a stale pinned preview URL when new asset names are introduced.
