name: Generate authentic Japanese listening dialogues (Aida Calm + morioki)

on:
  push:
    branches:
      - lesson/real-listening-dual-voice
    paths:
      - .github/workflows/dual-voice-listening.yml
      - scripts/tts/listening_dialogues_v2.json
      - scripts/tts/generate_listening_dialogues_v2.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: real-dialogue-audio-production
  cancel-in-progress: true

jobs:
  generate:
    name: Generate and verify two native Japanese conversations
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts and dialogue content contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/tts/generate_listening_dialogues_v2.py
          python3 - <<'PY'
          import json
          j=json.load(open('scripts/tts/listening_dialogues_v2.json'))
          assert j['schemaVersion']==2 and j['candidateOnly']
          assert len(j['tracks'])==2
          assert [t['id'] for t in j['tracks']]==['a','b']
          assert all(len(t['turns'])>=4 and {'male','female'}==set(s['speaker'] for s in t['turns']) for t in j['tracks'])
          assert all(all('ひらがな' not in s['text'] and 'カタカナ' not in s['text'] for s in t['turns']) for t in j['tracks'])
          assert j['voices']['male']['style']=='Calm' and j['voices']['female']['style']=='ノーマル'
          PY
      - name: Download exact licensed AivisHub models to isolated engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aivis/Models"
          curl -fLSs --retry 3 --retry-delay 3 --max-time 480 \
            'https://api.aivis-project.com/v1/aivm-models/47e53151-a378-46f3-abee-ce13aa07feb1/download?model_type=AIVMX' \
            -o "$RUNNER_TEMP/aivis/Models/aida-shigeru.aivmx"
          curl -fLSs --retry 3 --retry-delay 3 --max-time 480 \
            'https://api.aivis-project.com/v1/aivm-models/baaae3c0-7b22-4605-8ba5-80c959b41a48/download?model_type=AIVMX' \
            -o "$RUNNER_TEMP/aivis/Models/morioki.aivmx"
          echo "6dabe29de5ec2c1715e12a430805e1bff6ec64a315cccec2d26fad029df83243  $RUNNER_TEMP/aivis/Models/aida-shigeru.aivmx" | sha256sum -c -
          echo "352858a737b23fe0bd0b7bd73a4956be262aad9bb24a7bf0d1eae9a71a466469  $RUNNER_TEMP/aivis/Models/morioki.aivmx" | sha256sum -c -
          chmod -R a+rX "$RUNNER_TEMP/aivis"
          sudo chown -R 1000:1000 "$RUNNER_TEMP/aivis"
      - name: Boot AivisSpeech CPU inference engine with both speakers
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name aivis-engine --pull=always \
            -p 127.0.0.1:10101:10101 \
            -v "$RUNNER_TEMP/aivis:/home/user/.local/share/AivisSpeech-Engine-Dev" \
            ghcr.io/aivis-project/aivisspeech-engine:cpu-latest
          ready=0
          for i in $(seq 1 120); do
            if curl -fsS --connect-timeout 3 --max-time 8 http://127.0.0.1:10101/speakers -o "$RUNNER_TEMP/speakers.json"; then
              if python3 - "$RUNNER_TEMP/speakers.json" <<'PY'
          import json,sys
          speakers=json.load(open(sys.argv[1]))
          expected={'561e4e59-3bc9-4726-9028-44a3c12a6f1d':'Calm','396a746d-742f-4e43-b722-1182a7fab9af':'ノーマル'}
          for uid,style in expected.items():
              if not any(s.get('speaker_uuid')==uid and any(t['name']==style for t in s.get('styles',[])) for s in speakers):
                  sys.exit(1)
          PY
              then ready=1; break; fi
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' aivis-engine 2>/dev/null || true)" != true ]; then
              docker logs --tail 100 aivis-engine || true
              exit 1
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            docker logs --tail 150 aivis-engine || true
            echo 'Both exact licensed AivisSpeech voices could not be loaded.'
            exit 1
          fi
      - name: Generate original dual-speaker scripts and validate both actual WAVs
        run: python3 scripts/tts/generate_listening_dialogues_v2.py
      - name: Save production candidates and metadata for manual audition
        uses: actions/upload-artifact@v4
        with:
          name: dual-speaker-japanese-listening-l06-v2
          path: |
            public/audio/fja-l06-real-dialogue-*-v2.wav
            src/content/audio/l0-m01-c01-l06.json
            scripts/tts/listening_dialogues_v2.json
          retention-days: 14
          if-no-files-found: error
      - name: Commit exact versioned WAVs and metadata to review branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/audio/fja-l06-real-dialogue-a-v2.wav public/audio/fja-l06-real-dialogue-b-v2.wav src/content/audio/l0-m01-c01-l06.json
          if git diff --cached --quiet; then
            echo 'Real WAVs already committed'
          else
            git commit -m 'chore(audio): add audited dual-voice Japanese conversation WAVs'
            git push origin HEAD:refs/heads/lesson/real-listening-dual-voice
          fi
      - name: Diagnostic logs when voice synthesis fails
        if: failure()
        run: docker logs --tail 180 aivis-engine || true
